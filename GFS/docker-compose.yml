services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gfs-master
    command: ["/usr/local/bin/gfs-master", "--config", "/app/configs/docker/general-config.yml"]
    ports:
      - "${GFS_MASTER_PORT:-50051}:50051"
    volumes:
      - master-data:/app/storage/master
    networks:
      - gfsnet
    environment:
      - GFS_MODE=${GFS_MODE:-docker}

  chunk1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gfs-chunk1
    depends_on:
      - master
    command:
      [
        "/usr/local/bin/gfs-chunkserver",
        "--config",
        "/app/configs/docker/chunkserver-config.yml",
        "--host",
        "${GFS_CHUNK1_HOST:-chunk1}",
        "--listen-host",
        "0.0.0.0",
        "--port",
        "${GFS_CHUNK1_PORT:-8080}"
      ]
    ports:
      - "${GFS_CHUNK1_PORT:-8080}:${GFS_CHUNK1_PORT:-8080}"
    volumes:
      - chunk1-data:/app/storage/chunks
    networks:
      - gfsnet
    environment:
      - GFS_MODE=${GFS_MODE:-docker}
      - GFS_CHUNK1_HOST=${GFS_CHUNK1_HOST:-chunk1}
      - GFS_CHUNK1_PORT=${GFS_CHUNK1_PORT:-8080}

  chunk2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gfs-chunk2
    depends_on:
      - master
    command:
      [
        "/usr/local/bin/gfs-chunkserver",
        "--config",
        "/app/configs/docker/chunkserver-config.yml",
        "--host",
        "${GFS_CHUNK2_HOST:-chunk2}",
        "--listen-host",
        "0.0.0.0",
        "--port",
        "${GFS_CHUNK2_PORT:-8081}"
      ]
    ports:
      - "${GFS_CHUNK2_PORT:-8081}:${GFS_CHUNK2_PORT:-8081}"
    volumes:
      - chunk2-data:/app/storage/chunks
    networks:
      - gfsnet
    environment:
      - GFS_MODE=${GFS_MODE:-docker}
      - GFS_CHUNK2_HOST=${GFS_CHUNK2_HOST:-chunk2}
      - GFS_CHUNK2_PORT=${GFS_CHUNK2_PORT:-8081}

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gfs-client
    depends_on:
      - master
      - chunk1
      - chunk2
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    networks:
      - gfsnet

networks:
  gfsnet:
    driver: bridge

volumes:
  master-data:
  chunk1-data:
  chunk2-data:

